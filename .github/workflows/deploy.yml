name: Deploy to GitHub Pages

# Publish whenever a version tag (e.g. v1.2.3) is pushed.
on:
  push:
    tags:
      - 'v*'

# Required for the OIDC token that actions/deploy-pages uses.
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent two deployments from racing; let the latest tag win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy everything from the repo root.
          # index.html is served as the default page.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
